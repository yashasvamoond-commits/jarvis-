name: Build Legal Jarvis APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/android-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/android-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          TOOLS="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$TOOLS/sdkmanager" ]; then
            TOOLS="$(dirname "$(find "$SDK" -name sdkmanager -type f | head -n 1)")"
          fi
          echo "Using SDK: $SDK"
          echo "Using sdkmanager: $TOOLS"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$TOOLS" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$TOOLS/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$TOOLS/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          echo "Gradle reported the following problems:"
          grep -E "error: |^e: |FAILURE: |What went wrong|Execution failed|Could not " build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "---- tail ----"
          tail -50 build.log

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Legal-Jarvis.apk
          ls -lh dist/Legal-Jarvis.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legal-Jarvis-APK
          path: dist/Legal-Jarvis.apk
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Legal Jarvis — latest APK
          body: |
            ## Legal Jarvis — chamber edition

            Your private, on-device legal assistant for the Lenovo Yoga tablet.

            **Install:** download `Legal-Jarvis.apk` below, open it on the tablet, and allow installation from this source when Android asks.

            - Works fully offline; no account, no subscription, no data leaves the tablet.
            - English and Hindi, with a British Jarvis voice delivered by Android Text-to-Speech.
            - Smart filing for PDF and Word documents, e-Courts import, diary, procedural tracking, reminders and twice-daily briefings.

            Built automatically from the `${{ github.sha }}` commit.
          files: dist/Legal-Jarvis.apk
          make_latest: true
