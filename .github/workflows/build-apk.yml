name: Build Legal Jarvis APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Legal-Jarvis.apk
          ls -lh dist/Legal-Jarvis.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legal-Jarvis-APK
          path: dist/Legal-Jarvis.apk
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Legal Jarvis — latest APK
          body: |
            ## Legal Jarvis — chamber edition

            Your private, on-device legal assistant for the Lenovo Yoga tablet.

            **Install:** download `Legal-Jarvis.apk` below, open it on the tablet, and allow installation from this source when Android asks.

            - Works fully offline; no account, no subscription, no data leaves the tablet.
            - English and Hindi, with a British Jarvis voice delivered by Android Text-to-Speech.
            - Smart filing for PDF and Word documents, e-Courts import, diary, procedural tracking, reminders and twice-daily briefings.

            Built automatically from the `${{ github.sha }}` commit.
          files: dist/Legal-Jarvis.apk
          make_latest: true
