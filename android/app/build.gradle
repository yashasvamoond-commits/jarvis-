plugins {
    id 'com.android.application'
}

android {
    namespace 'com.legaljarvis.chamber'
    compileSdk 35

    signingConfigs {
        jarvis {
            storeFile file('../keystore/legaljarvis.p12')
            storePassword 'legaljarvis'
            keyAlias 'legaljarvis'
            keyPassword 'legaljarvis'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId "com.legaljarvis.chamber"
        minSdk 26
        targetSdk 35
        // Each CI build gets a higher version code so the tablet accepts it as an update.
        versionCode 1 + ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as Integer)
        versionName "1.0.0"
        resConfigs "en", "hi"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.jarvis
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.jarvis
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
